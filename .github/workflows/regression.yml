name: Regression tests
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run against disposable test database
        run: make test
      - name: Clean test stack
        if: always()
        run: make test-clean
