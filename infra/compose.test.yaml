# Isolated test-only stack: no production warehouse/source volumes or network.
name: olist-regression-tests
services:
  test-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_only
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./test-db-init.sh:/docker-entrypoint-initdb.d/01-test-db-init.sh:ro
      - ./postgres/warehouse-init:/olist-ddl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_test"]
      interval: 3s
      timeout: 3s
      retries: 25
  test-s3:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test_s3_access
      MINIO_ROOT_PASSWORD: test_s3_secret_only
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  test-runner:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    image: olist-airflow-regression:3.3.2
    depends_on:
      test-db:
        condition: service_healthy
      test-s3:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/airflow
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      AIRFLOW_CONN_OLIST_S3: '{"conn_type":"aws","login":"test_s3_access","password":"test_s3_secret_only","extra":{"endpoint_url":"http://test-s3:9000","region_name":"us-east-1"}}'
      AIRFLOW_CONN_OLIST_TEST_SOURCE: postgresql://olist_test_admin:ci_admin_only@test-db:5432/warehouse_test
      AIRFLOW_CONN_OLIST_TEST_RECONCILE: postgresql://olist_test_admin:ci_admin_only@test-db:5432/warehouse_test
      AIRFLOW_CONN_OLIST_TEST_ADMIN: postgresql://olist_test_admin:ci_admin_only@test-db:5432/warehouse_test
      AIRFLOW_CONN_OLIST_TEST_LOADER: postgresql://etl_loader:ci_loader_only@test-db:5432/warehouse_test
      OLIST_TEST_ADMIN_CONN_ID: olist_test_admin
      OLIST_RUN_DB_INTEGRATION: "1"
      OLIST_TEST_DBT: "1"
      DBT_HOST: test-db
      DBT_RUNNER_PASSWORD: ci_dbt_only
    volumes:
      - ../tests:/opt/airflow/tests:ro
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt:/opt/airflow/dbt:ro
      - ./postgres/warehouse-init:/opt/airflow/infra/postgres/warehouse-init:ro
    working_dir: /opt/airflow
    entrypoint: ["python", "-m", "pytest"]
    command: ["-v", "-ra", "/opt/airflow/tests"]
