# Place in dbt/models/marts/. Fixtures prove the purchase-time version rules without
# warehouse data. Run in CI: dbt test --select test_type:unit
version: 2

unit_tests:
  - name: dim_customer_builds_purchase_time_versions
    model: dim_customer
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_id: c1, customer_unique_id: u1, is_valid: true, customer_zip_code_prefix: '01001', customer_city: 'Sao Paulo', customer_state: 'SP'}
          - {customer_id: c2, customer_unique_id: u1, is_valid: true, customer_zip_code_prefix: '01001', customer_city: 'Sao Paulo', customer_state: 'SP'}
          - {customer_id: c3, customer_unique_id: u1, is_valid: true, customer_zip_code_prefix: '20000', customer_city: 'Rio', customer_state: 'RJ'}
          - {customer_id: c4, customer_unique_id: u2, is_valid: true, customer_zip_code_prefix: '01001', customer_city: 'Sao Paulo', customer_state: 'SP'}
          - {customer_id: c5, customer_unique_id: u2, is_valid: true, customer_zip_code_prefix: '20000', customer_city: 'Rio', customer_state: 'RJ'}
          - {customer_id: c6, customer_unique_id: u2, is_valid: true, customer_zip_code_prefix: '01001', customer_city: 'Sao Paulo', customer_state: 'SP'}
          - {customer_id: c7, customer_unique_id: u5, is_valid: true, customer_zip_code_prefix: '30000', customer_city: 'Belo Horizonte', customer_state: 'MG'}
          - {customer_id: c8, customer_unique_id: u5, is_valid: true, customer_zip_code_prefix: '40000', customer_city: 'Salvador', customer_state: 'BA'}
          - {customer_id: c9, customer_unique_id: u3, is_valid: true, customer_zip_code_prefix: '50000', customer_city: 'Recife', customer_state: 'PE'}
          - {customer_id: c10, customer_unique_id: u4, is_valid: false, customer_zip_code_prefix: '60000', customer_city: 'Bad', customer_state: 'XX'}
      - input: ref('stg_orders')
        rows:
          # u1: same address twice, then a move -> two versions (no split on unchanged address).
          - {order_id: o1, customer_id: c1, is_valid: true, order_purchase_timestamp: '2017-01-01 10:00:00+00'}
          - {order_id: o2, customer_id: c2, is_valid: true, order_purchase_timestamp: '2017-02-01 10:00:00+00'}
          - {order_id: o3, customer_id: c3, is_valid: true, order_purchase_timestamp: '2017-03-01 10:00:00+00'}
          # u2: A -> B -> A gives three versions (changes are compared to the previous purchase only).
          - {order_id: o4, customer_id: c4, is_valid: true, order_purchase_timestamp: '2017-01-01 10:00:00+00'}
          - {order_id: o5, customer_id: c5, is_valid: true, order_purchase_timestamp: '2017-02-01 10:00:00+00'}
          - {order_id: o6, customer_id: c6, is_valid: true, order_purchase_timestamp: '2017-03-01 10:00:00+00'}
          # u5: two purchases at the same instant -> lowest order_id (o7) decides.
          - {order_id: o7, customer_id: c7, is_valid: true, order_purchase_timestamp: '2017-04-01 10:00:00+00'}
          - {order_id: o8, customer_id: c8, is_valid: true, order_purchase_timestamp: '2017-04-01 10:00:00+00'}
          # u3: only an invalid order -> no history. u4: customer record invalid -> no history.
          - {order_id: o9, customer_id: c9, is_valid: false, order_purchase_timestamp: '2017-05-01 10:00:00+00'}
          - {order_id: o10, customer_id: c10, is_valid: true, order_purchase_timestamp: '2017-05-01 10:00:00+00'}
    expect:
      rows:
        - {customer_unique_id: u1, customer_zip_code_prefix: '01001', valid_from: '2017-01-01 10:00:00+00', valid_to: '2017-03-01 10:00:00+00', is_current: false, is_inferred: false}
        - {customer_unique_id: u1, customer_zip_code_prefix: '20000', valid_from: '2017-03-01 10:00:00+00', valid_to: null, is_current: true, is_inferred: false}
        - {customer_unique_id: u2, customer_zip_code_prefix: '01001', valid_from: '2017-01-01 10:00:00+00', valid_to: '2017-02-01 10:00:00+00', is_current: false, is_inferred: false}
        - {customer_unique_id: u2, customer_zip_code_prefix: '20000', valid_from: '2017-02-01 10:00:00+00', valid_to: '2017-03-01 10:00:00+00', is_current: false, is_inferred: false}
        - {customer_unique_id: u2, customer_zip_code_prefix: '01001', valid_from: '2017-03-01 10:00:00+00', valid_to: null, is_current: true, is_inferred: false}
        - {customer_unique_id: u5, customer_zip_code_prefix: '30000', valid_from: '2017-04-01 10:00:00+00', valid_to: null, is_current: true, is_inferred: false}
        - {customer_unique_id: '__unknown__', customer_zip_code_prefix: null, valid_from: null, valid_to: null, is_current: true, is_inferred: true}
