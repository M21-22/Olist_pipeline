name: olist
version: '1.0.0'
config-version: 2
profile: olist
model-paths: [models]
macro-paths: [macros]

flags:
  send_anonymous_usage_stats: false

models:
  olist:
    staging:
      +schema: staging
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: fail
      # Each mutable model declares its unique_key and hooks in its own SQL.
      # Full-snapshot reference tables need replacement, not upsert.
      +grants:
        select: [soda_reader]
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: [soda_reader, grafana_reader]
      # For individual models, indexes are declared in config() or properties YAML.
    api:
      +schema: api
      +materialized: view
      +grants:
        select: [api_reader, grafana_reader]
