# Dimension contracts are preserved from the original dimension YAML files.
# Fact contracts are not newly enforced until SQL output types are verified.
version: 2
models:
  - name: dim_customer
    description: Customer SCD2 dimension from valid purchases and their order-associated customer records,
      with an unknown member for unresolved references. Validity dates track purchase-observed geography.
    columns:
      - name: customer_sk
        description: Deterministic purchase-time version identifier; a reserved hash for the unknown member.
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Stable person-level natural key, or the reserved unknown identifier.
        data_tests:
          - not_null
      - name: representative_customer_id
        description: Order-associated source customer identifier selected for this version.
      - name: customer_zip_code_prefix
        description: Postal code prefix associated with the observed version.
      - name: customer_city
        description: Customer city at the observed version.
      - name: customer_state
        description: Customer state at the observed version.
      - name: valid_from
        description: Purchase timestamp that begins this version, inclusive.
      - name: valid_to
        description: Next geography change observed at purchase, exclusive; null means current.
      - name: is_current
        description: Whether this is the latest purchase-observed version.
        data_tests:
          - not_null
      - name: is_inferred
        description: True only for the unknown placeholder member.
        data_tests:
          - not_null
  - name: dim_product
    description: Current valid product attributes (SCD Type 1), one row per product_id, plus one reserved unknown
      member. A missing category translation does not remove an otherwise valid product. Rebuilt from latest-state
      staging.
    config:
      contract:
        enforced: true
    columns:
      - name: product_sk
        data_type: text
        description: Deterministic hash surrogate key, stable across Type 1 attribute updates.
        data_tests:
          - not_null
          - unique
      - name: product_id
        data_type: text
        description: Source natural key or reserved '__unknown__' identifier.
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        data_type: text
        description: Normalized source product category.
      - name: product_category_name_english
        data_type: text
        description: English category name, null when translation is unavailable.
      - name: product_name_length
        data_type: integer
        description: Length of the product name from the source typo-named field.
      - name: product_description_length
        data_type: integer
        description: Length of the product description from the source typo-named field.
      - name: product_photos_qty
        data_type: integer
        description: Number of product photos.
      - name: product_weight_g
        data_type: integer
        description: Product weight in grams.
      - name: product_length_cm
        data_type: integer
        description: Product length in centimeters.
      - name: product_height_cm
        data_type: integer
        description: Product height in centimeters.
      - name: product_width_cm
        data_type: integer
        description: Product width in centimeters.
      - name: source_updated_at
        data_type: timestamp with time zone
        description: Timestamp on the current source product record.
      - name: source_batch_id
        data_type: text
        description: Certified source batch of the current staging winner.
      - name: is_inferred
        data_type: boolean
        description: True only for the reserved unknown product dimension member.
        data_tests:
          - not_null
  - name: dim_seller
    description: 'Latest valid seller attributes, one row per seller_id plus one unknown placeholder. Type 1:
      regional reporting uses the seller''s current location, not their location at historical order time.'
    config:
      contract:
        enforced: true
    columns:
      - name: seller_sk
        data_type: text
        description: Stable, deterministic surrogate key for seller identity.
        data_tests:
          - not_null
          - unique
      - name: seller_id
        data_type: text
        description: Natural seller ID or the reserved unknown identifier.
        data_tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        data_type: text
        description: Current seller ZIP prefix, kept as text to preserve leading zeros.
      - name: seller_city
        data_type: text
        description: Normalized current seller city.
      - name: seller_state
        data_type: text
        description: Normalized current seller state.
      - name: source_updated_at
        data_type: timestamp with time zone
        description: Update timestamp of the current valid source record.
      - name: source_batch_id
        data_type: text
        description: Certified batch supplying the current seller record.
      - name: is_inferred
        data_type: boolean
        description: True only for the reserved unknown seller member.
        data_tests:
          - not_null
  - name: dim_geography
    description: ZIP-prefix reference dimension deduplicated from valid Olist geolocation samples. City/state
      are the most frequent observed pair for each prefix, with deterministic tie breaks; coordinates are mean
      values of samples for that pair only. One reserved unknown member absorbs missing ZIPs. Coordinates are
      approximate and are not delivery event locations.
    config:
      contract:
        enforced: true
    columns:
      - name: geography_sk
        data_type: text
        description: Stable surrogate key derived from the ZIP prefix.
        data_tests:
          - not_null
          - unique
      - name: zip_code_prefix
        data_type: text
        description: Source ZIP prefix, preserved as text; unknown uses reserved key.
        data_tests:
          - not_null
          - unique
      - name: city
        data_type: text
        description: Deterministically selected modal city for this ZIP prefix.
      - name: state
        data_type: text
        description: Deterministically selected modal state for this ZIP prefix.
      - name: latitude
        data_type: double precision
        description: Average latitude of valid samples in the selected city/state.
      - name: longitude
        data_type: double precision
        description: Average longitude of valid samples in the selected city/state.
      - name: coordinate_samples
        data_type: bigint
        description: Number of samples contributing to representative coordinates.
        data_tests:
          - not_null
      - name: is_inferred
        data_type: boolean
        description: True only for the unknown ZIP-prefix member.
        data_tests:
          - not_null
  - name: dim_date
    description: Gregorian date dimension for 2016-01-01 through 2035-12-31 inclusive, plus a reserved unknown
      member. date_sk uses integer YYYYMMDD and 0 for unknown. ISO weekdays are 1=Monday through 7=Sunday. No
      time zones are assumed; timestamp-to-date conversion is performed by fact models using an explicit business
      timezone.
    config:
      contract:
        enforced: true
    columns:
      - name: date_sk
        data_type: integer
        description: Integer YYYYMMDD key; zero for unknown.
        data_tests:
          - not_null
          - unique
      - name: calendar_date
        data_type: date
        description: Calendar day, null for the unknown member.
        data_tests:
          - unique
      - name: year
        data_type: integer
        description: Gregorian calendar year.
      - name: quarter
        data_type: integer
        description: Calendar quarter (1 through 4).
      - name: month
        data_type: integer
        description: Month number (1 through 12).
      - name: day_of_month
        data_type: integer
        description: Day number within month.
      - name: iso_day_of_week
        data_type: integer
        description: ISO day of week (1 Monday through 7 Sunday).
      - name: iso_week_of_year
        data_type: integer
        description: ISO week number (1 through 53).
      - name: month_start_date
        data_type: date
        description: First day of the calendar month.
      - name: is_weekend
        data_type: boolean
        description: True for Saturday or Sunday, null for unknown.
      - name: is_inferred
        data_type: boolean
        description: True only for the reserved unknown date member.
        data_tests:
          - not_null
  - name: fct_orders
    description: One current valid source order per order_id; amounts and counts aggregate current valid payment/item
      rows. The customer key identifies the version effective at purchase.
    columns:
      - name: order_sk
        description: Deterministic hashed surrogate key of the order.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Operational order identifier and fact grain.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Order-associated customer record ID; not the person-level natural key.
      - name: customer_unique_id
        description: Person-level customer identifier, if a valid customer lookup is available.
      - name: customer_sk
        description: Customer version effective at purchase, or unknown.
        data_tests:
          - not_null
      - name: customer_geography_sk
        description: Geography key from the order customer record ZIP prefix, or unknown.
        data_tests:
          - not_null
      - name: purchase_date_sk
        description: UTC calendar date key for order purchase; zero denotes unknown.
        data_tests:
          - not_null
      - name: order_status
        description: Latest valid order status.
      - name: purchased_at
        description: Order purchase timestamp.
      - name: approved_at
        description: Order approval timestamp.
      - name: delivered_to_carrier_at
        description: Carrier handover timestamp.
      - name: delivered_to_customer_at
        description: Customer delivery timestamp.
      - name: estimated_delivery_at
        description: Estimated delivery timestamp.
      - name: delivery_delay_days
        description: Actual delivery time minus estimated delivery time, in fractional days.
      - name: item_count
        description: Count of current valid order items.
        data_tests:
          - not_null
      - name: item_price_total
        description: Sum of valid item prices for this order.
        data_tests:
          - not_null
      - name: freight_total
        description: Sum of valid item freight values for this order.
        data_tests:
          - not_null
      - name: payment_count
        description: Count of current valid order payments.
        data_tests:
          - not_null
      - name: payment_total
        description: Sum of valid payment values for this order.
        data_tests:
          - not_null
      - name: source_updated_at
        description: Latest source update timestamp of the order.
      - name: source_batch_id
        description: Certified source batch supplying the current order winner.
      - name: row_fingerprint
        description: Hash of the projected fact attributes used to detect changed output rows.
        data_tests:
          - not_null
  - name: fct_order_items
    description: One current valid order item per item_pk; order_item_id is only an ordinal within an order.
      Unresolved dimension references map to reserved unknown keys.
    columns:
      - name: item_pk
        description: Operational stable order-item identifier and fact grain.
        data_tests:
          - not_null
          - unique
      - name: order_item_sk
        description: Deterministic hash key of item_pk.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Parent operational order identifier.
      - name: order_item_id
        description: Item ordinal inside the order; not globally unique.
      - name: product_id
        description: Source product identifier.
      - name: seller_id
        description: Source seller identifier.
      - name: product_sk
        description: Product dimension key or unknown.
        data_tests:
          - not_null
      - name: seller_sk
        description: Seller dimension key or unknown.
        data_tests:
          - not_null
      - name: seller_geography_sk
        description: Geography derived from the current seller ZIP prefix, or unknown.
        data_tests:
          - not_null
      - name: purchase_date_sk
        description: UTC purchase calendar date key from the associated valid order, or zero.
        data_tests:
          - not_null
      - name: customer_sk
        description: Customer version effective at the parent order purchase, or unknown.
        data_tests:
          - not_null
      - name: shipping_limit_at
        description: Shipping deadline of the item.
      - name: price
        description: Current valid item price.
      - name: freight_value
        description: Current valid freight amount.
      - name: gross_item_amount
        description: Price plus freight for this item.
      - name: source_updated_at
        description: Latest source update timestamp of the item.
      - name: source_batch_id
        description: Certified source batch supplying the current item winner.
      - name: row_fingerprint
        description: Hash of projected attributes used for change detection.
        data_tests:
          - not_null
  - name: fct_payments
    description: One current valid payment per (order_id, payment_sequential); payment_sk is a deterministic
      identifier for that composite grain.
    columns:
      - name: payment_sk
        description: Deterministic hash of order_id and payment_sequential.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Operational parent order identifier; part of the composite grain.
        data_tests:
          - not_null
      - name: payment_sequential
        description: Payment sequence within an order; part of the composite grain.
        data_tests:
          - not_null
      - name: payment_type
        description: Payment method as recorded in source.
      - name: payment_installments
        description: Number of payment installments.
      - name: payment_value
        description: Current valid payment amount.
      - name: purchase_date_sk
        description: UTC purchase date of the associated valid order, or zero.
        data_tests:
          - not_null
      - name: customer_sk
        description: Currently observed SCD2 customer version key, or unknown.
        data_tests:
          - not_null
      - name: source_updated_at
        description: Latest source update timestamp of the payment.
      - name: source_batch_id
        description: Certified source batch supplying the current payment winner.
      - name: row_fingerprint
        description: Hash of projected attributes used for change detection.
        data_tests:
          - not_null
  - name: fct_reviews
    description: One current valid source review per review_pk; review_id is not guaranteed to be unique.
    columns:
      - name: review_pk
        description: Operational stable review-row identifier and fact grain.
        data_tests:
          - not_null
          - unique
      - name: review_sk
        description: Deterministic hash key of review_pk.
        data_tests:
          - not_null
          - unique
      - name: review_id
        description: Source review identifier, not necessarily unique.
      - name: order_id
        description: Operational order identifier associated with the review.
      - name: review_score
        description: Customer review score.
      - name: review_created_at
        description: Review creation timestamp.
      - name: review_answered_at
        description: Timestamp when the review was answered.
      - name: review_comment_title
        description: Review title text, if present.
      - name: review_comment_message
        description: Review message text, if present.
      - name: review_date_sk
        description: UTC review creation date key, or zero.
        data_tests:
          - not_null
      - name: customer_sk
        description: Customer version effective at the parent order purchase, or unknown.
        data_tests:
          - not_null
      - name: source_updated_at
        description: Latest source update timestamp of the review.
      - name: source_batch_id
        description: Certified source batch supplying the current review winner.
      - name: row_fingerprint
        description: Hash of projected attributes used for change detection.
        data_tests:
          - not_null
